name: Kotlin compatibility

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile representative multiplatform core modules
        run: |
          ./gradlew \
            -Pbuild_release=true \
            -Penable_python_package=false \
            -Parchitecture=x86_64 \
            :commons:compileKotlinJvm \
            :commons:compileKotlinJs \
            :commons:compileKotlinWasmJs \
            :plot-base:compileKotlinJvm \
            :plot-base:compileKotlinJs \
            :plot-base:compileKotlinWasmJs \
            :plot-builder:compileKotlinJvm \
            :plot-builder:compileKotlinJs \
            :plot-builder:compileKotlinWasmJs \
            :plot-raster:compileKotlinJvm \
            :plot-raster:compileKotlinJs \
            :plot-raster:compileKotlinWasmJs \
            --stacktrace

      - name: Run representative JVM tests
        run: |
          ./gradlew \
            -Pbuild_release=true \
            -Penable_python_package=false \
            -Parchitecture=x86_64 \
            :plot-base:jvmTest \
            :plot-builder:jvmTest \
            :plot-raster:jvmTest \
            --stacktrace
